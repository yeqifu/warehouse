<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="UTF-8">
    <title>仓库管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="/resources/favicon.ico">
    <link rel="stylesheet" href="resources/layui/css/layui.css" th:href="@{/resources/layui/css/layui.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/css/public.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/layui_ext/dtree/dtree.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/layui_ext/dtree/font/dtreefont.css}" media="all"/>
</head>
<body>
<!--查询条件-->
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>搜索条件</legend>
</fieldset>
<form action="" method="post" id="searchFrm" lay-filter="searchFrm" class="layui-form">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">仓库名称</label>
            <div class="layui-input-inline">
                <input type="text" name="warehousename" id="warehousename" class="layui-input input-radius"
                       placeholder="请输入仓库名称">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">负责人</label>
            <div class="layui-input-inline">
                <input type="text" name="manager" id="manager" class="layui-input input-radius" placeholder="请输入负责人">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">联系电话</label>
            <div class="layui-input-inline">
                <input type="text" name="phone" id="phone" class="layui-input input-radius" placeholder="请输入联系电话">
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block" style="text-align: center;padding-right: 15%;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-radius" lay-submit="" lay-filter="doSearch"><i
                    class="layui-icon layui-icon-search layui-icon-normal"></i>查询
            </button>
            <button type="reset" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-warm"><i
                    class="layui-icon layui-icon-refresh"></i><span>重置</span>
            </button>
        </div>
    </div>
</form>

<!--数据表格-->
<div>
    <table class="layui-hide" id="warehouseTable" lay-filter="warehouseTable"></table>
    <div id="warehouseToolBar" style="display: none">
        <button type="button" lay-event="add" shiro:hasPermission="warehouse:create" class="layui-btn layui-btn-sm layui-btn-normal layui-btn-radius">
            <i class="layui-icon layui-icon-add-1"></i>添加仓库
        </button>
    </div>
    <div id="warehouseRowBar" style="display: none;">
        <button type="button" lay-event="update" shiro:hasPermission="warehouse:update" class="layui-btn layui-btn-sm layui-btn-radius"><i
                class="layui-icon layui-icon-edit"></i>编辑
        </button>
        <button type="button" lay-event="delete" shiro:hasPermission="warehouse:delete" class="layui-btn layui-btn-sm layui-btn-danger layui-btn-radius"><i
                class="layui-icon layui-icon-delete"></i>删除
        </button>
    </div>
</div>

<!--添加和修改弹出层-->
<div id="addOrUpdateDiv" style="display: none;padding: 10px;padding-right: 5%">
    <form action="" method="post" class="layui-form" id="dataFrm" lay-filter="dataFrm">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">仓库名称</label>
                <div class="layui-input-block">
                    <input type="hidden" name="id">
                    <input type="text" name="warehousename" lay-verify="required" autocomplete="off"
                           class="layui-input input-radius" placeholder="请输入仓库名称">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">仓库地址</label>
                <div class="layui-input-block">
                    <input type="text" name="address" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入仓库地址">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">负责人</label>
                <div class="layui-input-block">
                    <input type="text" name="manager" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入负责人">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">联系电话</label>
                <div class="layui-input-block">
                    <input type="text" name="phone" lay-verify="required|number" autocomplete="off" class="layui-input input-radius" placeholder="请输入联系电话">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">仓库容量</label>
                <div class="layui-input-block">
                    <input type="number" name="capacity" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入仓库容量">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">是否可用</label>
                <div class="layui-input-block">
                    <input type="radio" name="available" value="1" title="可用" checked="">
                    <input type="radio" name="available" value="0" title="不可用">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" lay-verify="required" autocomplete="off" class="layui-textarea" placeholder="请输入备注"></textarea>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;padding-right: 7%">
                <button type="button" class="layui-btn layui-btn-radius" lay-submit="" lay-filter="doSubmit" id="doSubmit"><i
                        class="layui-icon layui-icon-search layui-icon-normal"></i>提交
                </button>
                <button type="reset" class="layui-btn layui-btn-radius layui-btn-warm"><i
                        class="layui-icon layui-icon-refresh"></i><span>重置</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="/resources/layui/layui.js"></script>

<script type="text/javascript">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

    layui.use(['jquery', 'form', 'layer', 'table'], function () {
        var $ = layui.jquery;
        var form = layui.form;
        var layer = layui.layer;
        var table = layui.table;

        //初始化表格 加载数据
        tableIns = table.render({
            elem: "#warehouseTable",
            title: "仓库数据表格",
            url: "/warehouse/loadAllWarehouse",
            toolbar: "#warehouseToolBar",
            page: true,
            height: "full-180",
            cols: [ [
                {type:'checkbox',fixed:'left'},
                {field: 'id', title: 'ID', align: 'center',width:'50'},
                {field: 'warehousename', title: '仓库名称', align: 'center',width:'100'},
                {field: 'address', title: '仓库地址', align: 'center',width:'150'},
                {field: 'manager', title: '负责人', align: 'center',width:'100'},
                {field: 'phone', title: '联系电话', align: 'center',width:'140'},
                {field: 'capacity', title: '仓库容量', align: 'center',width:'100'},
                {field: 'remark', title: '备注', align: 'center',width:'150'},
                {field: 'available', title: '是否可用', align: 'center',width:'100',templet:function (d) {
                    return d.available==1?'<span style="color: green;">可用</span>':'<span style="color: red;">不可用</span>';
                }},
                {field: 'createTime', title: '创建时间', align: 'center',width:'150'},
                {field: 'updateTime', title: '更新时间', align: 'center',width:'150'},
                {fixed: 'right', title: '操作', align: 'center',width:'150',toolbar:'#warehouseRowBar'}
            ] ]
        });

        //监听头部工具栏事件
        table.on('toolbar(warehouseTable)', function (obj) {
            switch (obj.event) {
                case 'add':
                    openAddOrUpdateWarehouseDialog();
                    break;
            }
        });

        //监听行工具栏事件
        table.on('tool(warehouseTable)', function (obj) {
            var data = obj.data;
            switch (obj.event) {
                case 'update':
                    openAddOrUpdateWarehouseDialog(data);
                    break;
                case 'delete':
                    deleteWarehouse(data.id);
                    break;
            }
        });

        //监听表单提交事件
        form.on('submit(doSearch)', function (data) {
            tableIns.reload({
                where: data.field,
                page: {
                    curr: 1
                }
            });
            return false;
        });

        //监听添加或修改表单提交事件
        form.on('submit(doSubmit)', function (data) {
            var url = data.field.id?"/warehouse/updateWarehouse":"/warehouse/addWarehouse";
            $.post(url,data.field,function (result) {
                if (result.code==200){
                    layer.msg(result.msg);
                    layer.closeAll();
                    reloadTable();
                }else {
                    layer.msg(result.msg);
                }
            },'json');
            return false;
        });

        //打开添加或修改仓库对话框
        function openAddOrUpdateWarehouseDialog(data) {
            $('#dataFrm')[0].reset();
            form.val('dataFrm',data);
            layer.open({
                type: 1,
                title: data?"修改仓库":"添加仓库",
                content: $('#addOrUpdateDiv'),
                area: ['800px', '500px'],
                maxmin: true,
                btn: ['提交','取消'],
                yes: function(index, layero){
                    $('#doSubmit').click();
                }
            });
        }

        //删除仓库
        function deleteWarehouse(id) {
            layer.confirm('确定要删除这个仓库吗？', function(index){
                $.post("/warehouse/deleteWarehouse",{id:id},function (result) {
                    if (result.code==200){
                        layer.msg(result.msg);
                        reloadTable();
                    }else {
                        layer.msg(result.msg);
                    }
                },'json');
                layer.close(index);
            });
        }

        //重新加载数据表格
        function reloadTable() {
            tableIns.reload();
        }
    });
</script>
</body>
</html>
