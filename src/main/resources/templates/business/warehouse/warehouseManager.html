<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="UTF-8">
    <title>仓库管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="/resources/favicon.ico">
    <link rel="stylesheet" href="resources/layui/css/layui.css" th:href="@{/resources/layui/css/layui.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/css/public.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/layui_ext/dtree/dtree.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/layui_ext/dtree/font/dtreefont.css}" media="all"/>
</head>
<body>
<!--查询条件-->
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>搜索条件</legend>
</fieldset>
<form action="" method="post" id="searchFrm" lay-filter="searchFrm" class="layui-form">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">仓库编码</label>
            <div class="layui-input-inline">
                <input type="text" name="code" id="code" class="layui-input input-radius"
                       placeholder="请输入仓库编码">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">仓库名称</label>
            <div class="layui-input-inline">
                <input type="text" name="name" id="name" class="layui-input input-radius" placeholder="请输入仓库名称">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">仓库类型</label>
            <div class="layui-input-inline">
                <input type="text" name="type" id="type" class="layui-input input-radius" placeholder="请输入仓库类型">
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">所属区域</label>
            <div class="layui-input-inline">
                <input type="text" name="region" id="region" class="layui-input input-radius" placeholder="请输入所属区域">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">负责人</label>
            <div class="layui-input-inline">
                <input type="text" name="manager" id="manager" class="layui-input input-radius" placeholder="请输入负责人">
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block" style="text-align: center;padding-right: 15%;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-radius" lay-submit="" lay-filter="doSearch"><i
                    class="layui-icon layui-icon-search layui-icon-normal"></i>查询
            </button>
            <button type="reset" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-warm"><i
                    class="layui-icon layui-icon-refresh"></i><span>重置</span>
            </button>
        </div>
    </div>
</form>

<!--数据表格-->
<div>
    <table class="layui-hide" id="warehouseTable" lay-filter="warehouseTable"></table>
    <div id="warehouseToolBar" style="display: none">
        <button type="button" lay-event="add" shiro:hasPermission="warehouse:create" class="layui-btn layui-btn-sm layui-btn-normal layui-btn-radius">
            <i class="layui-icon layui-icon-add-1"></i>添加仓库
        </button>
    </div>
    <div id="warehouseRowBar" style="display: none;">
        <button type="button" lay-event="update" shiro:hasPermission="warehouse:update" class="layui-btn layui-btn-sm layui-btn-radius"><i
                class="layui-icon layui-icon-edit"></i>编辑
        </button>
        <button type="button" lay-event="delete" shiro:hasPermission="warehouse:delete" class="layui-btn layui-btn-sm layui-btn-danger layui-btn-radius"><i
                class="layui-icon layui-icon-delete"></i>删除
        </button>
    </div>
</div>

<!--添加和修改弹出层-->
<div id="addOrUpdateDiv" style="display: none;padding: 10px;padding-right: 5%">
    <form action="" method="post" class="layui-form" id="dataFrm" lay-filter="dataFrm">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">仓库编码</label>
                <div class="layui-input-block">
                    <input type="hidden" name="id">
                    <input type="text" name="code" lay-verify="required" autocomplete="off"
                           class="layui-input input-radius" placeholder="请输入仓库编码">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">仓库名称</label>
                <div class="layui-input-block">
                    <input type="text" name="name" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入仓库名称">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">仓库类型</label>
                <div class="layui-input-block">
                    <input type="text" name="type" autocomplete="off" class="layui-input input-radius" placeholder="请输入仓库类型（常温/冷链/危险品等）">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">所属区域</label>
                <div class="layui-input-block">
                    <input type="text" name="region" autocomplete="off" class="layui-input input-radius" placeholder="请输入所属区域/城市">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">详细地址</label>
                <div class="layui-input-block">
                    <input type="text" name="address" autocomplete="off" class="layui-input input-radius" placeholder="请输入详细地址">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">负责人</label>
                <div class="layui-input-block">
                    <input type="text" name="manager" autocomplete="off" class="layui-input input-radius" placeholder="请输入负责人">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">联系方式</label>
                <div class="layui-input-block">
                    <input type="text" name="phone" autocomplete="off" class="layui-input input-radius" placeholder="请输入联系方式">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">理论容量</label>
                <div class="layui-input-block">
                    <input type="number" name="capacity" autocomplete="off" class="layui-input input-radius" placeholder="请输入理论容量（件/立方）">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">是否可用</label>
                <div class="layui-input-block">
                    <input type="radio" name="available" value="1" title="可用" checked="">
                    <input type="radio" name="available" value="0" title="不可用">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" autocomplete="off" class="layui-input input-radius" placeholder="请输入备注" rows="3"></textarea>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;padding-right: 7%">
                <button type="button" class="layui-btn layui-btn-radius" lay-submit="" lay-filter="doSubmit" id="doSubmit"><i
                        class="layui-icon layui-icon-search layui-icon-normal"></i>提交
                </button>
                <button type="reset" class="layui-btn layui-btn-radius layui-btn-warm"><i
                        class="layui-icon layui-icon-refresh"></i><span>重置</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="/resources/layui/layui.js"></script>

<script type="text/javascript">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

    layui.use(['jquery', 'form', 'layer', 'table'], function () {
        var $ = layui.jquery;
        var form = layui.form;
        var layer = layui.layer;
        var table = layui.table;

        //初始化表格 加载数据
        tableIns = table.render({
            elem: "#warehouseTable",
            title: "仓库数据表格",
            url: "/warehouse/loadAllWarehouse",
            toolbar: "#warehouseToolBar",
            page: true,
            height: "full-180",
            cols: [ [
                {type:'checkbox',fixed:'left'},
                {field: 'id', title: 'ID', align: 'center',width:'50'},
                {field: 'code', title: '仓库编码', align: 'center',width:'120'},
                {field: 'name', title: '仓库名称', align: 'center',width:'150'},
                {field: 'type', title: '仓库类型', align: 'center',width:'120'},
                {field: 'region', title: '所属区域', align: 'center',width:'120'},
                {field: 'address', title: '详细地址', align: 'center',width:'200'},
                {field: 'manager', title: '负责人', align: 'center',width:'100'},
                {field: 'phone', title: '联系方式', align: 'center',width:'130'},
                {field: 'capacity', title: '理论容量', align: 'center',width:'120'},
                {field: 'available', title: '是否可用', align: 'center',width:'100',templet:function (d) {
                    return d.available==1?'<font color="blue">可用</font>':'<font color="red">不可用</font>';
                }},
                {field: 'remark', title: '备注', align: 'center',width:'200'},
                {field: 'createtime', title: '创建时间', align: 'center',width:'160'},
                {field: 'updatetime', title: '更新时间', align: 'center',width:'160'},
                {fixed: 'right', title: '操作', toolbar: '#warehouseRowBar', align: 'center',width:'180'}
            ] ],
            done: function (data, curr, count) {
                //不是第一页时，如果当前返回的数据为0那么就返回上一页
                if (data.data.length == 0 && curr != 1) {
                    tableIns.reload({
                        page: {
                            curr: curr - 1
                        }
                    })
                }
            }
        });

        //监控模糊查询按钮事件
        form.on("submit(doSearch)", function (data) {
            tableIns.reload({
                where: data.field,
                page: {
                    curr: 1
                }
            });
            return false;
        });

        //监控工具条事件
        table.on("toolbar(warehouseTable)", function (obj) {
            switch (obj.event) {
                case 'add':
                    openAddLayer();
                    break;
                case 'deleteBatch':
                    batchDeleteWarehouse();
                    break;
            };
        });

        //监控行工具条事件
        table.on("tool(warehouseTable)", function (obj) {
            //获取当前行数据
            var data = obj.data;
            switch (obj.event) {
                case 'delete':
                    deleteWarehouse(data);
                    break;
                case 'update':
                    updateWarehouse(data);
                    break;
            };
        });

        var mainIndex;
        var url;

        //打开添加弹出层
        function openAddLayer() {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['700px','550px'],
                title:'添加仓库',
                success:function () {
                    $("#dataFrm")[0].reset();
                    url="/warehouse/addWarehouse";
                }
            });
        }

        //打开修改的弹出层
        function updateWarehouse(data) {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['700px','550px'],
                title:'修改仓库',
                success:function () {
                    //清空原有的数据
                    $("#dataFrm")[0].reset();
                    //装载新的数据
                    form.val("dataFrm",data);
                    url="/warehouse/updateWarehouse";
                }
            });
        }

        form.on("submit(doSubmit)",function (data) {
            $.post(url,data.field,function (res) {
                if (res.code==200){
                    tableIns.reload();
                }
                layer.msg(res.msg);
                layer.close(mainIndex);
            });
            return false;
        });

        //删除
        function deleteWarehouse(data) {
            layer.confirm('你确定要删除【' + data.name + '】这个仓库吗？', {icon: 3, title: '提示'}, function (index) {
                $.post("/warehouse/deleteWarehouse", {id: data.id},function (res) {
                    if (res.code == 200) {
                        tableIns.reload({
                            where:"",
                        });
                    }
                    layer.msg(res.msg);
                });
                layer.close(index);
            });
        }

    });

</script>

</body>
</html>
