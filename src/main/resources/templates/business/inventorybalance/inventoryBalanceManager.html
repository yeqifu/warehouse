<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="UTF-8">
    <title>商品库存统计表</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="/resources/favicon.ico">
    <link rel="stylesheet" href="resources/layui/css/layui.css" th:href="@{/resources/layui/css/layui.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/css/public.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/layui_ext/dtree/dtree.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/resources/layui_ext/dtree/font/dtreefont.css}" media="all"/>
</head>
<body>
<!--查询条件-->
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>搜索条件</legend>
</fieldset>
<form action="" method="post" id="searchFrm" lay-filter="searchFrm" class="layui-form">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">仓库</label>
            <div class="layui-input-inline">
                <input type="text" name="warehouseName" id="warehouseName" class="layui-input input-radius"
                       placeholder="请输入仓库名称">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">商品</label>
            <div class="layui-input-inline">
                <input type="text" name="goodsName" id="goodsName" class="layui-input input-radius" placeholder="请输入商品名称">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">供应商</label>
            <div class="layui-input-inline">
                <input type="text" name="providerName" id="providerName" class="layui-input input-radius" placeholder="请输入供应商名称">
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">批次号</label>
            <div class="layui-input-inline">
                <input type="text" name="batchNo" id="batchNo" class="layui-input input-radius" placeholder="请输入批次号">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">库位编码</label>
            <div class="layui-input-inline">
                <input type="text" name="locCode" id="locCode" class="layui-input input-radius" placeholder="请输入库位编码">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline">
                <select name="status" id="status" class="layui-select input-radius">
                    <option value="">全部状态</option>
                    <option value="1">可用</option>
                    <option value="0">冻结</option>
                </select>
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block" style="text-align: center;padding-right: 15%;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-radius" lay-submit="" lay-filter="doSearch"><i
                    class="layui-icon layui-icon-search layui-icon-normal"></i>查询
            </button>
            <button type="reset" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-warm"><i
                    class="layui-icon layui-icon-refresh"></i><span>重置</span>
            </button>
        </div>
    </div>
</form>

<!--数据表格-->
<div>
    <table class="layui-hide" id="inventoryBalanceTable" lay-filter="inventoryBalanceTable"></table>
    <div id="inventoryBalanceToolBar" style="display: none">
        <button type="button" lay-event="add" shiro:hasPermission="inventorybalance:create" class="layui-btn layui-btn-sm layui-btn-normal layui-btn-radius">
            <i class="layui-icon layui-icon-add-1"></i>添加库存
        </button>
    </div>
    <div id="inventoryBalanceRowBar" style="display: none;">
        <button type="button" lay-event="update" shiro:hasPermission="inventorybalance:update" class="layui-btn layui-btn-sm layui-btn-radius"><i
                class="layui-icon layui-icon-edit"></i>编辑
        </button>
        <button type="button" lay-event="delete" shiro:hasPermission="inventorybalance:delete" class="layui-btn layui-btn-sm layui-btn-danger layui-btn-radius"><i
                class="layui-icon layui-icon-delete"></i>删除
        </button>
    </div>
</div>

<!--添加和修改弹出层-->
<div id="addOrUpdateDiv" style="display: none;padding: 10px;padding-right: 5%">
    <form action="" method="post" class="layui-form" id="dataFrm" lay-filter="dataFrm">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">仓库ID</label>
                <div class="layui-input-block">
                    <input type="hidden" name="id">
                    <input type="text" name="warehouseId" lay-verify="required" autocomplete="off"
                           class="layui-input input-radius" placeholder="请输入仓库ID">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">商品ID</label>
                <div class="layui-input-block">
                    <input type="text" name="goodsId" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入商品ID">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">批次号</label>
                <div class="layui-input-block">
                    <input type="text" name="batchNo" autocomplete="off" class="layui-input input-radius" placeholder="请输入批次号">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">库位编码</label>
                <div class="layui-input-block">
                    <input type="text" name="locCode" autocomplete="off" class="layui-input input-radius" placeholder="请输入库位编码">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">计量单位</label>
                <div class="layui-input-block">
                    <input type="text" name="uom" autocomplete="off" class="layui-input input-radius" placeholder="请输入计量单位">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">账面库存</label>
                <div class="layui-input-block">
                    <input type="text" name="quantityOnHand" autocomplete="off" class="layui-input input-radius" placeholder="请输入账面库存数量">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">已锁定数量</label>
                <div class="layui-input-block">
                    <input type="text" name="quantityReserved" autocomplete="off" class="layui-input input-radius" placeholder="请输入已锁定数量">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">安全库存</label>
                <div class="layui-input-block">
                    <input type="text" name="safetyStock" autocomplete="off" class="layui-input input-radius" placeholder="请输入安全库存数量">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="可用" checked="">
                    <input type="radio" name="status" value="0" title="冻结">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" autocomplete="off" class="layui-input input-radius" placeholder="请输入备注" rows="3"></textarea>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;padding-right: 7%">
                <button type="button" class="layui-btn layui-btn-radius" lay-submit="" lay-filter="doSubmit" id="doSubmit"><i
                        class="layui-icon layui-icon-search layui-icon-normal"></i>提交
                </button>
                <button type="reset" class="layui-btn layui-btn-radius layui-btn-warm"><i
                        class="layui-icon layui-icon-refresh"></i><span>重置</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="/resources/layui/layui.js"></script>

<script type="text/javascript">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

    layui.use(['jquery', 'form', 'layer', 'table'], function () {
        var $ = layui.jquery;
        var form = layui.form;
        var layer = layui.layer;
        var table = layui.table;

        //初始化表格 加载数据
        tableIns = table.render({
            elem: "#inventoryBalanceTable",
            title: "商品库存统计表",
            url: "/inventorybalance/loadAllInventoryBalance",
            toolbar: "#inventoryBalanceToolBar",
            page: true,
            height: "full-180",
            cols: [ [
                {type:'checkbox',fixed:'left'},
                {field: 'id', title: 'ID', align: 'center',width:'50', sort: true},
                {field: 'warehouseId', title: '仓库ID', align: 'center',width:'100', sort: true},
                {field: 'goodsId', title: '商品ID', align: 'center',width:'100', sort: true},
                {field: 'batchNo', title: '批次号', align: 'center',width:'120', sort: true},
                {field: 'locCode', title: '库位编码', align: 'center',width:'120', sort: true},
                {field: 'uom', title: '计量单位', align: 'center',width:'100'},
                {field: 'quantityOnHand', title: '账面库存', align: 'right',width:'120', sort: true},
                {field: 'quantityReserved', title: '已锁定数量', align: 'right',width:'120', sort: true},
                {field: 'quantityAvailable', title: '可用库存', align: 'right',width:'120', sort: true},
                {field: 'safetyStock', title: '安全库存', align: 'right',width:'120', sort: true},
                {field: 'status', title: '状态', align: 'center',width:'100', sort: true,templet:function (d) {
                    return d.status==1?'<font color="blue">可用</font>':'<font color="red">冻结</font>';
                }},
                {field: 'remark', title: '备注', align: 'center',width:'200'},
                {field: 'lastCountedAt', title: '最近盘点时间', align: 'center',width:'160'},
                {field: 'updatedAt', title: '更新时间', align: 'center',width:'160', sort: true},
                {fixed: 'right', title: '操作', toolbar: '#inventoryBalanceRowBar', align: 'center',width:'180'}
            ] ],
            done: function (data, curr, count) {
                //不是第一页时，如果当前返回的数据为0那么就返回上一页
                if (data.data.length == 0 && curr != 1) {
                    tableIns.reload({
                        page: {
                            curr: curr - 1
                        }
                    })
                }
            }
        });

        //监控模糊查询按钮事件
        form.on("submit(doSearch)", function (data) {
            tableIns.reload({
                where: data.field,
                page: {
                    curr: 1
                }
            });
            return false;
        });

        //监控工具条事件
        table.on("toolbar(inventoryBalanceTable)", function (obj) {
            switch (obj.event) {
                case 'add':
                    openAddLayer();
                    break;
                case 'deleteBatch':
                    batchDeleteInventoryBalance();
                    break;
            };
        });

        //监控行工具条事件
        table.on("tool(inventoryBalanceTable)", function (obj) {
            //获取当前行数据
            var data = obj.data;
            switch (obj.event) {
                case 'delete':
                    deleteInventoryBalance(data);
                    break;
                case 'update':
                    updateInventoryBalance(data);
                    break;
            };
        });

        var mainIndex;
        var url;

        //打开添加弹出层
        function openAddLayer() {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['700px','550px'],
                title:'添加库存',
                success:function () {
                    $("#dataFrm")[0].reset();
                    url="/inventorybalance/addInventoryBalance";
                }
            });
        }

        //打开修改的弹出层
        function updateInventoryBalance(data) {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['700px','550px'],
                title:'修改库存',
                success:function () {
                    //清空原有的数据
                    $("#dataFrm")[0].reset();
                    //装载新的数据
                    form.val("dataFrm",data);
                    url="/inventorybalance/updateInventoryBalance";
                }
            });
        }

        form.on("submit(doSubmit)",function (data) {
            $.post(url,data.field,function (res) {
                if (res.code==200){
                    tableIns.reload();
                }
                layer.msg(res.msg);
                layer.close(mainIndex);
            });
            return false;
        });

        //删除
        function deleteInventoryBalance(data) {
            layer.confirm('你确定要删除库存记录【ID: ' + data.id + '】吗？', {icon: 3, title: '提示'}, function (index) {
                $.post("/inventorybalance/deleteInventoryBalance", {id: data.id},function (res) {
                    if (res.code == 200) {
                        tableIns.reload({
                            where:"",
                        });
                    }
                    layer.msg(res.msg);
                });
                layer.close(index);
            });
        }

    });

</script>

</body>
</html>
